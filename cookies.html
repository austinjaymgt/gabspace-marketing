<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cookie Policy — Gabspace</title>
  <meta name="description" content="How Gabspace uses cookies and similar technologies."/>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16.png"/>
  <link rel="apple-touch-icon" href="assets/img/favicon-32.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #2B1A2A;
      --ink2: #6B7280;
      --ink3: #9CA3AF;
      --cream: #F5F5F7;
      --white: #FFFFFF;
      --sage: #1F9C8F;
      --violet: #6A3F7A;
      --violet-pale: #EDE5F4;
      --border: #E2E2E4;
      --border-soft: #F0F0F2;
      --orb-gradient: radial-gradient(circle at 35% 30%, #7FD8FF 0%, #4FA8E8 55%, #6A5CD0 100%);
      --radius: 12px;
      --radius-pill: 100px;
    }
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--cream); color: var(--ink); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    a.link { color: var(--violet); }
    a.link:hover { text-decoration: underline; }

    nav { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2.5rem; border-bottom: 0.5px solid var(--border-soft); background: var(--cream); position: sticky; top: 0; z-index: 100; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 34px; height: 34px; flex-shrink: 0; background: var(--orb-gradient); border-radius: 42% 58% 65% 35% / 45% 40% 60% 55%; box-shadow: 0 0 14px rgba(79,168,232,0.45); }
    .logo-name { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
    .nav-back { font-size: 0.875rem; color: var(--ink3); transition: color 0.2s; }
    .nav-back:hover { color: var(--ink); }

    .page { max-width: 820px; margin: 0 auto; padding: 4rem 2.5rem 3rem; }
    .page-eye { font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--violet); margin-bottom: 0.9rem; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.2rem, 4.5vw, 3rem); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 0.75rem; color: var(--ink); }
    .page-sub { font-size: 1rem; color: var(--ink3); font-weight: 300; line-height: 1.7; max-width: 620px; }
    .divider-thin { height: 0.5px; background: var(--border-soft); margin: 2.5rem 0; }
    .policy-frame { background: var(--white); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 2.25rem 2.5rem; }

    footer { border-top: 0.5px solid var(--border-soft); padding: 1.75rem 2.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .foot-logo { display: flex; align-items: center; gap: 8px; }
    .foot-logo-mark { width: 22px; height: 22px; flex-shrink: 0; background: var(--orb-gradient); border-radius: 42% 58% 65% 35% / 45% 40% 60% 55%; }
    .foot-name { font-family: 'Space Grotesk', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
    .foot-links { display: flex; gap: 1.5rem; list-style: none; flex-wrap: wrap; }
    .foot-links a { font-size: 0.78rem; color: var(--ink3); transition: color 0.2s; }
    .foot-links a:hover { color: var(--ink); }
    .foot-copy { font-size: 0.72rem; color: var(--ink3); }

    @media (max-width: 640px) {
      nav { padding: 1rem 1.25rem; }
      .page { padding: 2.5rem 1.25rem 2rem; }
      .policy-frame { padding: 1.5rem 1.25rem; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo-wrap">
    <div class="logo-mark"></div>
    <span class="logo-name">gabspace</span>
  </a>
  <a href="/" class="nav-back">← Back to gabspace.io</a>
</nav>

<main class="page">
  <div class="page-eye">Legal</div>
  <h1 class="page-title">Cookie Policy</h1>
  <p class="page-sub">How Gabspace uses cookies and similar technologies to keep the product working smoothly.</p>
  <div class="divider-thin"></div>
  <div class="policy-frame">
    <!-- Termly Cookie Policy Embed -->
    <div name="termly-embed" data-id="90631a50-7f30-416f-8990-a5827cb483b3" data-type="iframe"></div>
    <script type="text/javascript">(function(d, s, id) {
      var js, tjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = "https://app.termly.io/embed-policy.min.js";
      tjs.parentNode.insertBefore(js, tjs);
    }(document, 'script', 'termly-jssdk'));</script>
  </div>
</main>

<footer>
  <div class="foot-logo">
    <div class="foot-logo-mark"></div>
    <span class="foot-name">gabspace</span>
  </div>
  <ul class="foot-links">
    <li><a href="/">Home</a></li>
    <li><a href="/privacy.html">Privacy</a></li>
    <li><a href="/cookies.html">Cookies</a></li>
    <li><a href="/acceptable-use.html">Acceptable Use</a></li>
    <li><a href="/subprocessors.html">Subprocessors</a></li>
  </ul>
  <div class="foot-copy">© 2026 Gabspace. All rights reserved.</div>
</footer>

</body>
</html>
